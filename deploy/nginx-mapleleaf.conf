# nginx site for the Maple Leaf Django site.
# Install to /etc/nginx/sites-available/mapleleaf, then symlink into sites-enabled.
# Replace the domain names before running `sudo nginx -t`.

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Photo requests allow up to four 6 MB uploads plus form overhead.
    client_max_body_size 30M;

    location /static/ {
        alias /srv/mapleleaf/staticfiles/;
    }

    location /media/ {
        alias /srv/mapleleaf/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
